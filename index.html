<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>실측 평면도 · 가구 배치</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#16232e;--sub:#5b6b78;--line:#16232e;--meas:#0a5bb5;--scn:#d4691e;--rule:#d5dde3;--bad:#c62828;--fill:#fff1e6;--soft:#e8f0fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181f;--panel:#18232c;--ink:#e6edf2;--sub:#97a7b3;--line:#cfdbe4;--meas:#6db3ff;--scn:#ff9a57;--rule:#2c3b47;--bad:#ff6b6b;--fill:#3a2a1e;--soft:#1f3347}}
:root[data-theme="dark"]{--bg:#10181f;--panel:#18232c;--ink:#e6edf2;--sub:#97a7b3;--line:#cfdbe4;--meas:#6db3ff;--scn:#ff9a57;--rule:#2c3b47;--bad:#ff6b6b;--fill:#3a2a1e;--soft:#1f3347}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.4;overflow:hidden}
.top{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--rule)}
.top h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[hidden]{display:none!important}
button,.btn{font:inherit;font-size:14px;min-height:40px;min-width:40px;padding:0 12px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
button.on{background:var(--soft);border-color:var(--meas);color:var(--meas);font-weight:700}
button.p{background:var(--meas);border-color:var(--meas);color:#fff;font-weight:700}
button.danger{color:var(--bad)}
.btn{display:inline-flex;align-items:center;text-decoration:none;font-size:14px;min-height:40px;padding:0 12px;border:1px solid var(--meas);border-radius:8px;color:var(--meas);font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--meas);outline-offset:1px}
.plan{flex:1;min-height:0;position:relative;background:#fff}
svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{position:absolute;left:8px;bottom:8px;font-size:12px;color:#fff;background:rgba(22,35,46,.72);padding:3px 8px;border-radius:12px;pointer-events:none}
.dock{background:var(--panel);border-top:1px solid var(--rule);max-height:46%;overflow:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.list{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;min-height:36px;border-radius:18px;font-size:13.5px;padding:0 13px}
.chip.add{background:var(--meas);border-color:var(--meas);color:#fff;font-weight:700}
.row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--sub);gap:2px;flex:1;min-width:76px}
label.n{flex:2;min-width:110px}
input[type=text],input[type=number],input[type=url]{font:inherit;font-size:16px;min-height:42px;padding:0 10px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.pad{display:flex;gap:4px;margin-left:auto}
.sm{font-size:12px;color:var(--sub);margin-top:6px}
.ttl{font-size:13px;font-weight:700;margin-top:2px}
.ttl b{color:var(--scn)}
.dl{stroke:var(--meas);stroke-width:16}
.dm{fill:var(--meas);font-size:190px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:55;stroke-linejoin:round;font-family:inherit}
.dm2{font-size:115px}
.ob{fill:rgba(10,91,181,.14);stroke:var(--meas);stroke-width:20}
.ob2{fill:rgba(10,91,181,.05);stroke:var(--meas);stroke-width:16;stroke-dasharray:60 40}
.f rect{fill:var(--fill);stroke:var(--scn);stroke-width:22;cursor:grab}
.f.s rect{stroke:var(--meas);stroke-width:40}
.f.bad rect{stroke:var(--bad)}
.f text{fill:#16232e;text-anchor:middle;pointer-events:none;font-family:inherit}
.wb{fill:#f4f6f8;stroke:#c3ccd4;stroke-width:24;stroke-dasharray:120 80}
.wbt{fill:#7a8a96;font-size:260px;font-weight:700;font-family:inherit}
.b{cursor:grab}
.b text{pointer-events:none;font-family:inherit}
.bf{fill:#fff}
.bo{fill:none;stroke:#9aa8b3;stroke-width:20}
.bf.bo{fill:#fff}
.b.s .bo{stroke:#0a5bb5;stroke-width:45}
.bt{fill:#16232e}
.bs{fill:#5b6b78}
.bh{fill:#0a5bb5;stroke:#fff;stroke-width:12;cursor:nwse-resize}
.pc{fill:#0a5bb5;stroke:#fff;stroke-width:3}
.b.s .pc{fill:#d4691e}
.pl{fill:#16232e;paint-order:stroke;stroke:#fff;stroke-width:3.5;stroke-linejoin:round}
.sy{position:relative;padding:0 10px}
.sy svg{width:22px;height:22px;display:block;margin:auto}
.sy::after{content:'';position:absolute;right:5px;top:6px;width:8px;height:8px;border-radius:50%;background:#9aa8b3}
.sy[data-s=ok]::after{background:#2e9d5b}.sy[data-s=pend]::after,.sy[data-s=conn]::after{background:#e8a317}
.sy[data-s=err]::after,.sy[data-s=full]::after{background:var(--bad)}.sy[data-s=local]::after{display:none}
.ttl.gap{margin-top:14px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--rule);font-size:14px}
.trow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th{display:block;max-width:100%;max-height:140px;border-radius:8px;margin-top:6px;cursor:zoom-in}
.ov{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:12px}
.ov img{max-width:100%;max-height:100%}
@media (max-width:400px){.top{gap:4px}.top h1{font-size:0}.top button{padding:0 9px}}
</style></head>
<body>
<header class="top"><h1>실측 평면도</h1>
<button id="sn" class="on" title="50mm 단위로 맞춤">맞춤</button><button id="fit">전체</button><button id="wbb" title="사진·링크 모아두는 곳">작업대</button><button id="zo" aria-label="축소">−</button><button id="zi" aria-label="확대">＋</button><button id="sy" class="sy" aria-label="저장·동기화"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18.5h10.2a4.3 4.3 0 0 0 .6-8.55A6.2 6.2 0 0 0 5.9 9.4 4.6 4.6 0 0 0 7 18.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button></header>
<div class="plan" id="pw"><svg id="p" viewBox="-739 -5693 14381 11032" role="img" aria-label="실측 평면도"></svg><div class="hint">두 손가락 확대 · 빈 곳 끌어서 이동</div></div>
<input type="file" id="fi" accept="image/*" multiple hidden><input type="file" id="bkf" accept="application/json,.json" hidden>
<div class="ov" id="ov" hidden><img id="ovi" alt="크게 보기"></div>
<section class="dock"><div class="list" id="ls"></div><div id="pn"></div></section>

const bcur=()=>B.find(b=>b.id===bsel);
// 사진은 용량이 커서 IndexedDB에 따로 보관
const idb=(m,k,val)=>new Promise((res,rej)=>{try{const q=indexedDB.open('song-board',1);q.onupgradeneeded=()=>q.result.createObjectStore('img');q.onerror=()=>rej(q.error);q.onsuccess=()=>{const t=q.result.transaction('img',m==='get'?'readonly':'readwrite'),st=t.objectStore('img'),r=m==='get'?st.get(k):m==='put'?st.put(val,k):st.delete(k);t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)}}catch(e){rej(e)}});
const URL_RE=/https?:\/\/[^\s<>"']+/i;
const nurl=u=>{u=String(u||'').trim();if(!u)return'';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;try{const x=new URL(u);return/^https?:$/.test(x.protocol)?x.href:''}catch(e){return''}};
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u||''}};
const tw=t=>[...t].reduce((s,c)=>s+(c.charCodeAt(0)>255?1:.58),0);
function clip(t,w,fs){t=String(t||'');if(tw(t)*fs<=w)return t;const a=[...t];while(a.length&&tw(a.join('')+'…')*fs>w)a.pop();return a.join('')+'…'}

const px=()=>{const r=box();return r.width?v.w/r.width:10};
const hs=()=>px()*30;
function bdraw(b){
 const par=b.pin?PL:BL;
 let g=BG.get(b.id);
 if(!g){g=el('g',{},par);BG.set(b.id,g);g.addEventListener('pointerdown',e=>bdrag(e,b.id))}else if(g.parentNode!==par)par.appendChild(g);
 g.innerHTML='';g.setAttribute('transform',`translate(${b.x} ${b.y})`);g.setAttribute('class','b'+(b.pin?' pin':'')+(b.id===bsel?' s':''));
 if(b.pin){

  return;
 }
 if(b.k==='img'){

  el('rect',{width:b.w,height:b.h,class:'bf'},g);
  const src=IM.get(b.id);

  else el('text',{x:b.w/2,y:b.h/2,'font-size':fs,class:'bs','text-anchor':'middle'},g,'사진 불러오는 중');
  el('rect',{width:b.w,height:b.h,class:'bo'},g);
  const cap=[b.n,b.m].filter(Boolean).join(' · ')||host(b.u);
  if(cap)el('text',{x:0,y:b.h+fs*1.15,'font-size':fs,'font-weight':700,class:'bt'},g,clip((b.u?'🔗 ':'')+cap,b.w,fs));
 }else{
  const fs=Math.max(110,Math.min(320,b.h/4.4)),p=fs*.8;let y=p+fs;
  el('rect',{width:b.w,height:b.h,rx:80,class:'bf bo'},g);
  el('text',{x:p,y,'font-size':fs,'font-weight':700,class:'bt'},g,clip('🔗 '+(b.n||'링크'),b.w-2*p,fs));
  y+=fs*1.25;if(y<b.h-p/3)el('text',{x:p,y,'font-size':fs*.8,class:'bs'},g,clip(host(b.u),b.w-2*p,fs*.8));
  y+=fs*1.15;if(b.m&&y<b.h-p/3)el('text',{x:p,y,'font-size':fs*.85,class:'bt'},g,clip(b.m,b.w-2*p,fs*.85));
 }
 if(b.id===bsel){const r=hs();el('rect',{x:b.w-r/2,y:b.h-r/2,width:r,height:r,rx:r*.25,class:'bh'},g).addEventListener('pointerdown',e=>bresize(e,b.id))}
}
function bhd(){
 const k=px();PL.querySelectorAll('.pb').forEach(q=>q.setAttribute('transform',`scale(${k})`));
 const b=bcur(),h=b&&BG.get(b.id)&&BG.get(b.id).querySelector('.bh');if(!h)return;const r=hs();h.setAttribute('x',b.w-r/2);h.setAttribute('y',b.h-r/2);h.setAttribute('width',r);h.setAttribute('height',r);h.setAttribute('rx',r*.25)

function bselect(id,go){

 const b=bcur();if(b){if(B[B.length-1]!==b){b.z=Date.now();upd(b)}border();bdraw(b);if(go)reveal(b)}

}
function bmove(e,b,mv){
 const g=BG.get(b.id),k0=[b.x,b.y,b.w,b.h]+'';busy=b.id;
 try{g.setPointerCapture(e.pointerId)}catch(_){}
 const up=()=>{g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);busy=null;if([b.x,b.y,b.w,b.h]+''!==k0)upd(b)};

function bdrag(e,id){

function bresize(e,id){

const inR=(R,x,y)=>x>R.x&&x<R.x+R.w&&y>R.y&&y<R.y+R.h;
// 작업대를 보고 있으면 화면 가운데에 카드, 도면을 보고 있으면 그 자리에 핀, 그 밖엔 작업대 빈 칸에 카드
function spot(w,h,i){
 const cx=v.x+v.w/2,cy=v.y+v.h/2;
 if(inR(WB,cx,cy))return{x:Math.round(cx-w/2+i*300),y:Math.round(cy-h/2+i*300)};
 if(inR(BB,cx,cy)){let x=cx+i*px()*44;for(let j=0;j<10&&B.some(b=>b.pin&&Math.hypot(b.x-x,b.y-cy)<px()*36);j++)x+=px()*44;return{pin:true,x:Math.round(x),y:Math.round(cy)}}
 const n=B.length+i;return{x:WB.x+400+(n%3)*4200,y:WB.y+900+(Math.floor(n/3)%3)*3400};
}
function reveal(b){const cx=b.pin?b.x:b.x+b.w/2,cy=b.pin?b.y:b.y+b.h/2;if(inR(v,cx,cy))return;if(inR(WB,cx,cy))fit(WB);else{v.x=cx-v.w/2;v.y=cy-v.h/2;ap()}}
// 동기화용으로 한 장이 Firestore 문서 한도(1MB) 안에 들어가게 줄임
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{URL.revokeObjectURL(u);let k=Math.min(1,1400/Math.max(im.naturalWidth,im.naturalHeight)),s,c;
  for(let i=0;i<6;i++){c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);s=c.toDataURL('image/jpeg',.8);if(s.length<800000)break;k*=.75}
  res({s,w:c.width,h:c.height})};
 im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
async function addPhoto(file,i=0){
 if(!file||!/^image\//.test(file.type))return;
 let r;try{r=await shrink(file)}catch(e){alert('사진을 열 수 없어요.');return}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 const w=3200,h=Math.round(w*r.h/r.w),p=spot(w,h,i),b={id:nid(),k:'img',x:p.x,y:p.y,w,h,n:'',u:'',m:'',z:Date.now()};
 if(p.pin)b.pin=true;
 IM.set(b.id,r.s);
 try{await idb('put',b.id,r.s)}catch(e){b.src=r.s}
 B.push(b);bdraw(b);
 if(!upd(b)){delete b.src;persist();alert('기기 저장 공간이 부족해요. 백업 파일을 저장해 두세요.')}
 bselect(b.id,true);
}
function addLink(u,n,m){
 const k=String(u||'').match(URL_RE);u=nurl(k?k[0]:u);
 if(!u){alert('링크 주소를 확인해 주세요.');return}
 const w=3600,h=1500,p=spot(w,h,0),b={id:nid(),k:'link',x:p.x,y:p.y,w,h,n:String(n||'').slice(0,40)||host(u),u,m:String(m||'').slice(0,60),z:Date.now()};
 if(p.pin)b.pin=true;

}
// 사진 불러오기: 메모리 → 기기(IndexedDB) → 동기화 서버 순
function needImg(o,n=0){
 if(o.k!=='img'||IM.has(o.id)||LO.has(o.id))return;LO.add(o.id);
 const got=s=>{if(!s)return false;IM.set(o.id,s);LO.delete(o.id);if(BG.has(o.id))bdraw(o);if(bsel===o.id)panel();return true};
 if(o.src&&got(o.src))return;
 idb('get',o.id).then(s=>s||(o.ok!=null?idb('get',o.ok).then(s=>{if(s)idb('put',o.id,s).then(()=>{idb('del',o.ok);delete o.ok;persist()}).catch(()=>{});return s}):null)).catch(()=>null).then(s=>{
  if(got(s))return;
  if(!db){LO.delete(o.id);return}
  FS.getDoc(FS.doc(db,'rooms',room,'imgs',o.id)).then(d=>d.exists()?d.data().s:null).catch(()=>null).then(s=>{
   if(got(s)){idb('put',o.id,s).catch(()=>{});return}
   LO.delete(o.id);if(n<8&&find(o.id))setTimeout(()=>needImg(o,n+1),2000*(n+1)); // 올리는 중일 수 있어 잠시 뒤 다시
  });
 });
}
const fi=$('fi');fi.onchange=()=>{[...fi.files].forEach((f,i)=>addPhoto(f,i));fi.value=''};

// ---- 지우기 = 휴지통으로 (언제든 복구) ----
function unG(o){const m=o.k==='f'?G:BG,g=m.get(o.id);if(g){g.remove();m.delete(o.id)}}
// 항목을 상태(d·k)에 맞는 목록으로 옮기고 다시 그림
function place(o){
 const to=o.d?T:o.k==='f'?F:B;
 if(!to.includes(o)){[F,B,T].forEach(a=>{const i=a.indexOf(o);if(i>=0)a.splice(i,1)});to.push(o)}
 if(o.d){unG(o);if(sel===o.id)sel=null;if(bsel===o.id)bsel=null}
 else if(o.k==='f')draw(o);else{bdraw(o);needImg(o)}
}
function del(o){o.d=Date.now();upd(o);place(o);undo=o;sel=bsel=null;mark();dock()}
function restore(o){delete o.d;upd(o);place(o);border();mark();o.k==='f'?select(o.id):bselect(o.id,true)}

// ---- 백업 파일 (사진 포함) ----
async function backup(){
 const items=all().map(o=>({id:o.id,...pick(o)})),imgs={};
 for(const o of items)if(o.k==='img'){let s=IM.get(o.id);if(!s)try{s=await idb('get',o.id)}catch(e){}if(s)imgs[o.id]=s}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,items,imgs})],{type:'application/json'}));
 a.download=`평면도-백업-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
}
// 불러오면 지금 배치에 합침 (같은 항목은 더 최근 것만)
async function restoreFile(file){
 let d;try{d=JSON.parse(await file.text())}catch(e){}
 if(!d||!Array.isArray(d.items))return alert('백업 파일을 읽을 수 없어요.');
 let n=0;
 for(const r of d.items){
  if(!r||typeof r.id!=='string'||!(r.w>0&&r.h>0)||!['f','img','link'].includes(r.k))continue;
  const o=find(r.id);if(o&&(o.t||0)>=(r.t||0))continue;
  const s=d.imgs&&d.imgs[r.id];if(typeof s==='string'&&s.startsWith('data:image/')){IM.set(r.id,s);idb('put',r.id,s).catch(()=>{})}
  const x=o||{id:r.id};FIELDS.forEach(k=>{if(r[k]!=null)x[k]=r[k];else delete x[k]});x.t=Date.now();place(x);n++;
 }
 border();mark();save();dock();alert(n?`${n}개 항목을 불러왔어요.`:'새로 불러올 항목이 없어요. (이미 최신)');
